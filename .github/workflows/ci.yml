name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Tipos, lint, formato y build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obtener código
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Instalar dependencias desde el lockfile
        run: npm ci
      - name: Comprobar tipos de Astro y TypeScript
        run: npm run check
      - name: Comprobar lint y reglas de accesibilidad
        run: npm run lint
      - name: Comprobar formato
        run: npm run format:check
      - name: Compilar sitio estático
        run: npm run build
